; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = others/Boards

[env:esp32s3dev_n8r2]
platform = espressif32@8.0.0
board = esp32s3dev_n8r2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Arduino platform builder appends CORE_DEBUG_LEVEL=0 after project flags.
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
	; The prebuilt SDK fixes SmartConfig ACK task stack at 2 KB; expand only it.
	-Wl,--wrap=xTaskCreatePinnedToCore
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-Iothers
	; The board routes GPIO19/20 to WS2812 strips and uses CP2102 for USB serial.
	-DFASTLED_UNUSABLE_PIN_MASK=0x1F8000000ULL
lib_deps = 
	lovyan03/LovyanGFX@1.2.36
	lvgl/lvgl@8.4.0
	igorantolic/Ai Esp32 Rotary Encoder@1.7.0
	mathertel/OneButton@2.6.2
	fastled/FastLED@3.10.8
	simsso/ShiftRegister74HC595@1.3.1
	bblanchon/ArduinoJson@7.4.3
